# Cloud Build: FrankenPHP image for SitesPanel.
# Publish build: runs on a push to main and on the weekly rebuild. Builds, scans, writes SBOMs,
# then pushes to Artifact Registry with SLSA provenance (SitesPanel ADR-0065). Nothing is pushed
# when a scan finds a fixable critical vulnerability.

substitutions:
  _AR_HOST: europe-docker.pkg.dev
  _AR_REPOSITORY: sitespanel-images
  _SBOM_BUCKET: sitespanel-image-sboms-europe  # set per trigger if the bucket has another name

steps:
  - id: build-frankenphp-8.3
    name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - --build-arg=PHP_VERSION=8.3
      - --build-arg=DEBIAN_RELEASE=trixie
      - --label=org.opencontainers.image.source=https://github.com/sitespanel/frankenphp-docker
      - --label=org.opencontainers.image.revision=$COMMIT_SHA
      - --tag=${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/frankenphp:8.3-trixie
      - --tag=${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/frankenphp:8.3
      - --tag=${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/frankenphp:8.3-trixie-$SHORT_SHA
      - .
    waitFor: ['-']
  - id: build-frankenphp-8.4
    name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - --build-arg=PHP_VERSION=8.4
      - --build-arg=DEBIAN_RELEASE=trixie
      - --label=org.opencontainers.image.source=https://github.com/sitespanel/frankenphp-docker
      - --label=org.opencontainers.image.revision=$COMMIT_SHA
      - --tag=${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/frankenphp:8.4-trixie
      - --tag=${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/frankenphp:8.4
      - --tag=${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/frankenphp:8.4-trixie-$SHORT_SHA
      - .
    waitFor: ['-']
  - id: build-frankenphp-8.5
    name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - --build-arg=PHP_VERSION=8.5
      - --build-arg=DEBIAN_RELEASE=trixie
      - --label=org.opencontainers.image.source=https://github.com/sitespanel/frankenphp-docker
      - --label=org.opencontainers.image.revision=$COMMIT_SHA
      - --tag=${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/frankenphp:8.5-trixie
      - --tag=${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/frankenphp:8.5
      - --tag=${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/frankenphp:8.5-trixie-$SHORT_SHA
      - --tag=${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/frankenphp:latest
      - .
    waitFor: ['-']
  - id: save-frankenphp-8.3
    name: gcr.io/cloud-builders/docker
    args: ['save', '--output', '/workspace/frankenphp-8.3.tar', '${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/frankenphp:8.3-trixie']
    waitFor: ['build-frankenphp-8.3']
  - id: scan-frankenphp-8.3
    name: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
    entrypoint: sh
    args:
      - -ceu
      - |
        trivy image --cache-dir /workspace/.trivy --input /workspace/frankenphp-8.3.tar --severity CRITICAL --ignore-unfixed --exit-code 1 --format table
        mkdir -p /workspace/sbom
        trivy image --cache-dir /workspace/.trivy --input /workspace/frankenphp-8.3.tar --format spdx-json --output /workspace/sbom/frankenphp-8.3.spdx.json
    waitFor: ['save-frankenphp-8.3']
  - id: save-frankenphp-8.4
    name: gcr.io/cloud-builders/docker
    args: ['save', '--output', '/workspace/frankenphp-8.4.tar', '${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/frankenphp:8.4-trixie']
    waitFor: ['build-frankenphp-8.4']
  - id: scan-frankenphp-8.4
    name: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
    entrypoint: sh
    args:
      - -ceu
      - |
        trivy image --cache-dir /workspace/.trivy --input /workspace/frankenphp-8.4.tar --severity CRITICAL --ignore-unfixed --exit-code 1 --format table
        mkdir -p /workspace/sbom
        trivy image --cache-dir /workspace/.trivy --input /workspace/frankenphp-8.4.tar --format spdx-json --output /workspace/sbom/frankenphp-8.4.spdx.json
    waitFor: ['save-frankenphp-8.4', 'scan-frankenphp-8.3']
  - id: save-frankenphp-8.5
    name: gcr.io/cloud-builders/docker
    args: ['save', '--output', '/workspace/frankenphp-8.5.tar', '${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/frankenphp:8.5-trixie']
    waitFor: ['build-frankenphp-8.5']
  - id: scan-frankenphp-8.5
    name: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
    entrypoint: sh
    args:
      - -ceu
      - |
        trivy image --cache-dir /workspace/.trivy --input /workspace/frankenphp-8.5.tar --severity CRITICAL --ignore-unfixed --exit-code 1 --format table
        mkdir -p /workspace/sbom
        trivy image --cache-dir /workspace/.trivy --input /workspace/frankenphp-8.5.tar --format spdx-json --output /workspace/sbom/frankenphp-8.5.spdx.json
    waitFor: ['save-frankenphp-8.5', 'scan-frankenphp-8.4']

# Pushed only when every step succeeded; Cloud Build attaches SLSA provenance to these digests.
images:
  - ${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/frankenphp:8.3-trixie
  - ${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/frankenphp:8.3
  - ${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/frankenphp:8.3-trixie-$SHORT_SHA
  - ${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/frankenphp:8.4-trixie
  - ${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/frankenphp:8.4
  - ${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/frankenphp:8.4-trixie-$SHORT_SHA
  - ${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/frankenphp:8.5-trixie
  - ${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/frankenphp:8.5
  - ${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/frankenphp:8.5-trixie-$SHORT_SHA
  - ${_AR_HOST}/$PROJECT_ID/${_AR_REPOSITORY}/frankenphp:latest

artifacts:
  objects:
    location: gs://${_SBOM_BUCKET}/frankenphp/$COMMIT_SHA/
    paths: ['/workspace/sbom/*.spdx.json']

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
  requestedVerifyOption: VERIFIED

timeout: 7200s
