# Cloud Build: FrankenPHP image for SitesPanel.
# Pull-request build: builds and scans only. Nothing is pushed and no secret is read.
# To save build-minutes it builds a representative subset: frankenphp-8.5; the publish build builds all.

substitutions:
  _REGISTRY: ghcr.io/sitespanel

steps:
  - id: build-frankenphp-8.5
    name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - --build-arg=PHP_VERSION=8.5
      - --build-arg=DEBIAN_RELEASE=trixie
      - --label=org.opencontainers.image.source=https://github.com/sitespanel/frankenphp-docker
      - --label=org.opencontainers.image.revision=$COMMIT_SHA
      - --label=dev.sitespanel.build.id=$BUILD_ID
      - "--label=org.opencontainers.image.description=SitesPanel FrankenPHP images: Caddy and PHP 8.3 to 8.5 in one app server."
      - --tag=${_REGISTRY}/frankenphp:8.5-trixie
      - --tag=${_REGISTRY}/frankenphp:8.5
      - --tag=${_REGISTRY}/frankenphp:8.5-trixie-$SHORT_SHA
      - --tag=${_REGISTRY}/frankenphp:latest
      - .
    waitFor: ['-']
  - id: scan-frankenphp-8.5
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ['-ceu', 'docker save --output /workspace/frankenphp-8.5.tar ${_REGISTRY}/frankenphp:8.5-trixie']
    waitFor: ['build-frankenphp-8.5']
  - id: trivy-frankenphp-8.5
    name: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
    entrypoint: sh
    args:
      - -ceu
      - |
        trivy image --cache-dir /workspace/.trivy --input /workspace/frankenphp-8.5.tar --severity CRITICAL --ignore-unfixed --exit-code 1 --format table
        rm -f /workspace/frankenphp-8.5.tar
    waitFor: ['scan-frankenphp-8.5']

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 7200s
